<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dictionary Online</title>
    <link rel="stylesheet" href="assets/stylesheet/output.css" />
    <link rel="stylesheet" href="assets/icons/remixicon.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>دیکشنری آنلاین</h1>
      <p class="subtitle">یک کلمه‌ی انگلیسی بنویس و معنی و مثال‌هاشو ببین</p>

      <form class="search-box" id="searchForm">
        <input
          type="text"
          id="wordInput"
          placeholder="مثلاً: happiness"
          autocomplete="off"
          dir="ltr"
        />
        <button type="submit" id="searchBtn">جستجو</button>
      </form>

      <div class="status" id="status"></div>
      <div id="resultArea"></div>

      <!-- <footer>منبع: Free Dictionary API</footer> -->

      <footer class="site-footer">
        <div class="footer-profile">
          <div class="avatar-wrap">
            <img src="assets/img/nn2.jpg" alt="Behrokh" class="avatar" />
          </div>

          <div class="footer-info">
            <h3>Behrokh-Dev</h3>
            <p>Frontend Developer</p>
            <span class="footer-bottom">Made with ♥ by Behrokh </span>
          </div>
        </div>

        <div class="social-links">
          <a href="https://github.com/behrokh-dev" aria-label="GitHub" target="_blank">
            <i class="ri-github-fill"></i>
          </a>

          <a href="https://www.linkedin.com/in/behrokh-naderi/" aria-label="LinkedIn" target="_blank">
            <i class="ri-linkedin-box-fill"></i>
          </a>

          <a href="https://www.instagram.com/behrokh_dev" aria-label="Instagram" target="_blank">
            <i class="ri-instagram-line"></i>
          </a>

          <a href="mailto:naderibehrokh@gmail.com" aria-label="Gmail" target="_blank">
            <i class="ri-google-fill"></i>
          </a>
        </div>
      </footer>
    </div>
  </body>
  <script src="assets/javascript/master.js"></script>
</html>
